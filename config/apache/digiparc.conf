<VirtualHost *:80>
    ServerName digiparc.com
    ServerAlias www.digiparc.com
    ServerAdmin admin@digiparc.com

    DocumentRoot /var/www/html/digi/public

    <Directory /var/www/html/digi/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite rules
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [L,QSA]
        </IfModule>
    </Directory>

    # Deny access to sensitive directories
    <DirectoryMatch "(\.git|config|database|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # Deny access to sensitive files
    <FilesMatch "\.(env|ini|log|sql|md|json|lock|yml|yaml)$">
        Require all denied
    </FilesMatch>

    # Security Headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
        Header set Permissions-Policy "geolocation=(self), microphone=()"

        # CORS Headers (adjust for your needs)
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization"
    </IfModule>

    # PHP Settings
    php_value upload_max_filesize 10M
    php_value post_max_size 12M
    php_value memory_limit 256M
    php_value max_execution_time 300
    php_value max_input_time 300
    php_value session.gc_maxlifetime 7200

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/digiparc-error.log
    CustomLog ${APACHE_LOG_DIR}/digiparc-access.log combined

    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Browser caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
        ExpiresByType text/x-javascript "access plus 1 month"
        ExpiresByType application/x-shockwave-flash "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresDefault "access plus 2 days"
    </IfModule>
</VirtualHost>

# SSL Configuration (HTTPS)
<VirtualHost *:443>
    ServerName digiparc.com
    ServerAlias www.digiparc.com
    ServerAdmin admin@digiparc.com

    DocumentRoot /var/www/html/digi/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/digiparc.crt
    SSLCertificateKeyFile /etc/ssl/private/digiparc.key
    SSLCertificateChainFile /etc/ssl/certs/digiparc-chain.crt

    # Strong SSL Security
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory /var/www/html/digi/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Same configuration as HTTP above
    <DirectoryMatch "(\.git|config|database|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.(env|ini|log|sql|md|json|lock|yml|yaml)$">
        Require all denied
    </FilesMatch>

    # Security Headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    php_value upload_max_filesize 10M
    php_value post_max_size 12M
    php_value memory_limit 256M
    php_value max_execution_time 300

    ErrorLog ${APACHE_LOG_DIR}/digiparc-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/digiparc-ssl-access.log combined
</VirtualHost>
