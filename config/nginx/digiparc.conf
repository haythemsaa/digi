# DigiParc Fleet Management - Nginx Configuration
# Version 3.0.0

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name digiparc.com www.digiparc.com;

    # Let's Encrypt SSL verification
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html/digi/public;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digiparc.com www.digiparc.com;

    root /var/www/html/digi/public;
    index index.php index.html;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/digiparc.crt;
    ssl_certificate_key /etc/ssl/private/digiparc.key;
    ssl_trusted_certificate /etc/ssl/certs/digiparc-chain.crt;

    # Strong SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Headers (adjust for your needs)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Logging
    access_log /var/log/nginx/digiparc-access.log;
    error_log /var/log/nginx/digiparc-error.log;

    # Max upload size
    client_max_body_size 10M;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive directories
    location ~ ^/(config|database|storage|tests|vendor|\.git) {
        deny all;
        return 404;
    }

    # Deny access to sensitive files
    location ~* \.(env|ini|log|sql|md|json|lock|yml|yaml)$ {
        deny all;
        return 404;
    }

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # PHP Settings
        fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=12M \n memory_limit=256M \n max_execution_time=300";

        # Security
        fastcgi_hide_header X-Powered-By;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable logging for favicon and robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # API Rate Limiting (optional)
    location ^~ /api/ {
        limit_req zone=api burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}

# Rate Limiting Zone (for API)
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
