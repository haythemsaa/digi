<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <title>DeliveryAI - Chauffeur</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <i class="fas fa-brain fa-3x"></i>
                    <h1>Delivery AI</h1>
                    <p>Application Chauffeur</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Identifiant</label>
                        <input type="text" id="username" placeholder="Votre identifiant" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Mot de passe</label>
                        <input type="password" id="password" placeholder="Votre mot de passe" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Connexion
                    </button>
                </form>

                <div id="offline-indicator" class="offline-badge" style="display: none;">
                    <i class="fas fa-wifi-slash"></i> Mode hors ligne
                </div>
            </div>
        </div>

        <!-- Main App Screen -->
        <div id="main-screen" class="screen">
            <!-- Header -->
            <header class="app-header">
                <div class="header-content">
                    <h1><i class="fas fa-brain"></i> Delivery AI</h1>
                    <div class="header-actions">
                        <span id="driver-name" class="driver-name"></span>
                        <button id="logout-btn" class="btn-icon">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Navigation -->
            <nav class="bottom-nav">
                <button class="nav-item active" data-view="routes">
                    <i class="fas fa-route"></i>
                    <span>Missions</span>
                </button>
                <button class="nav-item" data-view="deliveries">
                    <i class="fas fa-box"></i>
                    <span>Livraisons</span>
                </button>
                <button class="nav-item" data-view="profile">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </button>
            </nav>

            <!-- Routes View -->
            <div id="routes-view" class="view active">
                <div class="view-header">
                    <h2>Mes Missions</h2>
                    <button id="refresh-routes" class="btn-icon">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <div id="routes-list" class="content-container">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Chargement...
                    </div>
                </div>
            </div>

            <!-- Deliveries View -->
            <div id="deliveries-view" class="view">
                <div class="view-header">
                    <h2>Livraisons en Cours</h2>
                </div>

                <div id="deliveries-list" class="content-container">
                    <!-- Will be populated dynamically -->
                </div>
            </div>

            <!-- Profile View -->
            <div id="profile-view" class="view">
                <div class="view-header">
                    <h2>Mon Profil</h2>
                </div>

                <div class="content-container">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <i class="fas fa-box-open text-primary"></i>
                            <div class="stat-value" id="stat-delivered">0</div>
                            <div class="stat-label">Livrées Aujourd'hui</div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-route text-success"></i>
                            <div class="stat-value" id="stat-distance">0</div>
                            <div class="stat-label">Km Parcourus</div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Informations</h3>
                        <p><strong>Nom:</strong> <span id="profile-name"></span></p>
                        <p><strong>Téléphone:</strong> <span id="profile-phone"></span></p>
                        <p><strong>Véhicule:</strong> <span id="profile-vehicle"></span></p>
                    </div>
                </div>
            </div>

            <!-- Route Detail Modal -->
            <div id="route-detail-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modal-route-title"></h2>
                        <button class="btn-close" id="close-route-detail">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <div class="modal-body">
                        <div id="route-info" class="route-info"></div>

                        <h3 class="mt-3">Liste des Arrêts</h3>
                        <div id="stops-list"></div>
                    </div>

                    <div class="modal-footer">
                        <button id="start-route-btn" class="btn btn-success btn-block">
                            <i class="fas fa-play"></i> Démarrer la Mission
                        </button>
                    </div>
                </div>
            </div>

            <!-- Delivery Modal -->
            <div id="delivery-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Livraison</h2>
                        <button class="btn-close" id="close-delivery">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <div class="modal-body">
                        <div id="delivery-info"></div>

                        <div class="form-group">
                            <label>Preuve de Livraison (Photo)</label>
                            <input type="file" id="delivery-photo" accept="image/*" capture="environment">
                            <canvas id="photo-preview" style="max-width: 100%; display: none;"></canvas>
                        </div>

                        <div class="form-group">
                            <label>Signature du Destinataire</label>
                            <canvas id="signature-pad" width="300" height="150"></canvas>
                            <button id="clear-signature" class="btn btn-sm btn-secondary mt-2">
                                <i class="fas fa-eraser"></i> Effacer
                            </button>
                        </div>

                        <div class="form-group">
                            <label>Notes</label>
                            <textarea id="delivery-notes" rows="3" placeholder="Notes sur la livraison..."></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button id="mark-delivered-btn" class="btn btn-success btn-block">
                            <i class="fas fa-check"></i> Marquer Livré
                        </button>
                        <button id="mark-failed-btn" class="btn btn-danger btn-block">
                            <i class="fas fa-times"></i> Échec Livraison
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
