version: '3.8'

services:
  # Web Server (Apache + PHP)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pakiparc_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_NAME=pakiparc
      - DB_USER=pakiparc_user
      - DB_PASS=pakiparc_password
    depends_on:
      - db
      - redis
    networks:
      - pakiparc_network

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: pakiparc_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pakiparc
      MYSQL_USER: pakiparc_user
      MYSQL_PASSWORD: pakiparc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - pakiparc_network

  # Redis (Cache & Sessions)
  redis:
    image: redis:7-alpine
    container_name: pakiparc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pakiparc_network

  # phpMyAdmin (Database Management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pakiparc_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: pakiparc_user
      PMA_PASSWORD: pakiparc_password
    depends_on:
      - db
    networks:
      - pakiparc_network

  # Backup Service (Automated Backups)
  backup:
    image: alpine:latest
    container_name: pakiparc_backup
    restart: unless-stopped
    volumes:
      - ./storage/backups:/backups
      - db_data:/var/lib/mysql:ro
    command: >
      sh -c "
        apk add --no-cache mysql-client &&
        while true; do
          mysqldump -h db -u pakiparc_user -ppakiparc_password pakiparc | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz &&
          find /backups -name 'backup_*.sql.gz' -mtime +7 -delete &&
          sleep 86400;
        done
      "
    depends_on:
      - db
    networks:
      - pakiparc_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  pakiparc_network:
    driver: bridge
